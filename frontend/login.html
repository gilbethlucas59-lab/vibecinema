<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - VibeCinema</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }

        a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>🎬 VibeCinema Login</h2>

    <input type="email" id="email" placeholder="Enter email" required>
    <input type="password" id="password" placeholder="Enter password" required>

    <button onclick="login()">Login</button>

    <p style="margin-top:15px;">
        Don't have an account? <a href="register.html">Register</a>
    </p>
</div>

<script>
    function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // simple validation
        if (!email || !password) {
            alert("Please fill all fields");
            return;
        }

        fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.token) {
                // save user + token
                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(data.user));

                alert("Login successful!");

                // redirect to profile
                window.location.href = "profile.html";
            } else {
                alert(data.error || "Login failed");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Server error");
        });
    }
</script>

</body>
</html>
