<!DOCTYPE html>
<html lang="en">
<head>
    <title>VibeCinema - Upload Movie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>VibeCinema</h1>
        <a href="index.html">Home</a>
    </nav>

    <div class="container">
        <h2>Upload New Movie</h2>
        <form id="uploadForm">
            <input type="text" id="title" placeholder="Movie Title" required><br><br>
            <textarea id="description" placeholder="Movie Description"></textarea><br><br>
            
            <label>Origin Country:</label>
            <select id="country">
                <option value="Tanzania">Tanzania</option>
                <option value="Nigeria">Nigeria</option>
                <option value="USA">USA</option>
                <option value="South Africa">South Africa</option>
            </select><br><br>

            <input type="file" id="videoFile" accept="video/*" required><br><br>
            <button type="submit">Post Movie</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('country', document.getElementById('country').value);
            formData.append('video', document.getElementById('videoFile').files[0]);

            const response = await fetch('http://localhost:5000/api/movies/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            alert(result.message);
        };
    </script>
</body>
</html>
